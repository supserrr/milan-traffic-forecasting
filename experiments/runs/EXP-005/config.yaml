run:
  id: EXP-005
  seeds:
  - 42
  - 1337
  - 2024
  device: auto
  notes: 'EXP-005: the same three seeds with calendar features off, as the control
    for EXP-004.'
  cli: '--models tcn --areas 5059 --seq-len 144 --scaling log1p-standard --no-calendar
    --seeds 42 1337 2024 --notes EXP-005: the same three seeds with calendar features
    off, as the control for EXP-004.'
  config_source: configs/experiment.yaml
data:
  areas:
  - 5059
  activity: internet
  seq_len: 144
  horizon: 1
  scaling: log1p-standard
  val_frac: 0.15555555555555556
  calendar_features: false
  test_window: eval_week
models:
  tcn:
    loss: mse
    lr: 0.001
    batch_size: 128
    max_epochs: 100
    patience: 10
    device: auto
    channels: 32
    levels: 6
    kernel_size: 3
    dropout: 0.1
training:
  loss: mse
  lr: 0.001
  batch_size: 128
  max_epochs: 100
  early_stopping:
    monitor: val_loss
    patience: 10
evaluation:
  metrics:
  - MAE
  - RMSE
  - MAPE
  - sMAPE
  - WAPE
  - MASE
  - R2
  mape_mode: epsilon
  mase_scale: training period (Hyndman)
  season: 144
  timing_reps: 20
  latency_reps: 50
