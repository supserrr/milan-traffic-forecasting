run:
  id: EXP-011
  seeds:
  - 42
  - 1337
  - 2024
  device: auto
  notes: 'EXP-011: capacity grid, TCN depth 5. Receptive field 125, which does not
    cover the 144-slot window the PACF argues for, so the oldest 19 steps of every
    window cannot reach the output. Tests whether the window the EDA derived is actually
    used.'
  cli: '--areas 5161 --seeds 42 1337 2024 --seq-len 144 --scaling log1p-standard --baselines
    --run-id EXP-011 --models tcn --levels 5 --notes EXP-011: capacity grid, TCN depth
    5. Receptive field 125, which does not cover the 144-slot window the PACF argues
    for, so the oldest 19 steps of every window cannot reach the output. Tests whether
    the window the EDA derived is actually used.'
  config_source: configs/experiment.yaml
data:
  areas:
  - 5161
  activity: internet
  seq_len: 144
  horizon: 1
  scaling: log1p-standard
  val_frac: 0.15555555555555556
  calendar_features: true
  test_window: eval_week
models:
  tcn:
    loss: mse
    lr: 0.001
    batch_size: 128
    max_epochs: 100
    patience: 10
    device: auto
    channels: 32
    levels: 5
    kernel_size: 3
    dropout: 0.1
training:
  loss: mse
  lr: 0.001
  batch_size: 128
  max_epochs: 100
  early_stopping:
    monitor: val_loss
    patience: 10
evaluation:
  metrics:
  - MAE
  - RMSE
  - MAPE
  - sMAPE
  - WAPE
  - MASE
  - R2
  mape_mode: epsilon
  mase_scale: training period (Hyndman)
  season: 144
  timing_reps: 20
  latency_reps: 50
