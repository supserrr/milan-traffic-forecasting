run:
  id: EXP-008
  seeds:
  - 42
  - 1337
  - 2024
  device: auto
  notes: 'EXP-008: the reported configuration. Three architectures on the three areas,
    log1p-standard, calendar features on, three seeds, against the reference forecasters
    at the same window. This is the run the report tables are built from.'
  cli: '--models lstm tcn gbt --baselines naive seasonal_naive_daily linear_ar_144
    --seq-len 144 --scaling log1p-standard --seeds 42 1337 2024 --notes EXP-008: the
    reported configuration. Three architectures on the three areas, log1p-standard,
    calendar features on, three seeds, against the reference forecasters at the same
    window. This is the run the report tables are built from.'
  config_source: configs/experiment.yaml
data:
  areas:
  - 5161
  - 5059
  - 5259
  activity: internet
  seq_len: 144
  horizon: 1
  scaling: log1p-standard
  val_frac: 0.15555555555555556
  calendar_features: true
  test_window: eval_week
models:
  lstm:
    loss: mse
    lr: 0.001
    batch_size: 128
    max_epochs: 100
    patience: 10
    device: auto
    hidden: 64
    layers: 1
    dropout: 0.1
  tcn:
    loss: mse
    lr: 0.001
    batch_size: 128
    max_epochs: 100
    patience: 10
    device: auto
    channels: 32
    levels: 6
    kernel_size: 3
    dropout: 0.1
  gbt:
    max_iter: 300
    learning_rate: 0.05
    max_leaf_nodes: 31
  naive: {}
  seasonal_naive_daily: {}
  linear_ar_144: {}
training:
  loss: mse
  lr: 0.001
  batch_size: 128
  max_epochs: 100
  early_stopping:
    monitor: val_loss
    patience: 10
evaluation:
  metrics:
  - MAE
  - RMSE
  - MAPE
  - sMAPE
  - WAPE
  - MASE
  - R2
  mape_mode: epsilon
  mase_scale: training period (Hyndman)
  season: 144
  timing_reps: 20
  latency_reps: 50
