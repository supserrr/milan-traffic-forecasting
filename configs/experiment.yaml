# Defaults for a training run. Every run copies its resolved config into
# experiments/runs/EXP-NNN/config.yaml, which is what makes a result reproducible.

run:
  id: null                       # EXP-NNN, assigned by the training script
  seed: 42
  seeds: [42, 1337, 2024]        # for the final, reported configurations
  device: auto                   # auto -> mps if available, else cpu
  notes: ""                      # why this run exists; copied into EXPERIMENT_LOG.md

data:
  square_id: null                # null -> top-1 square from square_totals.csv
  activity: internet
  seq_len: 144                   # justify from the PACF, not by default
  horizon: 1
  scaling: standard              # standard | minmax | log1p | log1p-standard | none
  val_frac: 0.15
  test_window: eval_week         # eval_week -> Dec 16-22 from data.yaml

training:
  batch_size: 128
  max_epochs: 100
  early_stopping:
    patience: 10
    min_delta: 1.0e-4
    monitor: val_loss
  optimizer:
    name: adam
    lr: 1.0e-3
    weight_decay: 0.0
  lr_scheduler:
    name: reduce_on_plateau
    factor: 0.5
    patience: 5
  loss: mse                      # mse | mae | huber - a choice worth an experiment
  grad_clip: 1.0

evaluation:
  metrics: [MAE, RMSE, MAPE, sMAPE, WAPE, MASE, R2]
  mape_mode: epsilon             # epsilon | mask | raw - state which in the report
  mape_epsilon: 1.0e-3
  season: 144                    # MASE / seasonal-naive period
  baselines: [naive, seasonal_naive]

tuning:
  strategy: manual               # manual first; grid only where reasoning runs out
  grid: {}                       # e.g. {seq_len: [36, 72, 144], hidden: [32, 64, 128]}
